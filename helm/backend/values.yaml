image:
  repository: andreykapturin/todo-back
  tag: "latest"
 
resources:
  requests:
    cpu: "60m"
    memory: "100Mi"
  limits:
    cpu: "100m"
    memory: "120Mi"
 
config:
  envs:  
    NODE_ENV: "production"
    APP_VERSION: "manual_v2"
    PORT: 3000
  servicePort: 3001

hpa:
  minReplicas: "1"
  maxReplicas: "5"
  cpuUtilization: "70"
  memoryUtilization: "80"