apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      name: postgres
  serviceName: postgres-service
  replicas: 1
  template:
    metadata:
      labels:
        name: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
          - name: POSTGRES_DB
            valueFrom:
              secretKeyRef:
                key: DB_NAME
                name: app-secrets
          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                key: DB_USER
                name: app-secrets
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                key: DB_PASSWORD
                name: app-secrets
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi

---

apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    name: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None
