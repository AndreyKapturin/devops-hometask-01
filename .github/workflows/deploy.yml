name: Deploy via helm

on:
  push:
    branches: [helm]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.bp.outputs.image }}
      version: ${{ steps.bp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push backend
        id: bp
        run: |
          IMAGE=${{ vars.DOCKER_USER }}/todo-back:sha-${{ github.sha }}
          docker build --platform linux/amd64 -t $IMAGE -t ${{ vars.DOCKER_USER }}/todo-back:latest back
          docker push $IMAGE
          docker push ${{ vars.DOCKER_USER }}/todo-back:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "version=sha-${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
  
      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_KUBER }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
  
      - name: Install Helm
        uses: azure/setup-helm@v4
  
      - name: Deploy with Helm
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_sha }}
        run: |
          helm upgrade backend ./helm/backend \
            --reuse-values \
            --set image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 4m

  notify:
    needs: [checks, build, deploy]
    if: always()
    uses: ./.github/workflows/notify.yaml
    with:
      results: |
        {
          "checks": "${{ needs.checks.result }}",
          "build":  "${{ needs.build.result }}",
          "deploy": "${{ needs.deploy.result }}"
        }
      version: "sha-${{ github.sha }}"
    secrets:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}