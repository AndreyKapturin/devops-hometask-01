name: CI/CD (AWS)
 
on:
  push:
    branches: [aws]
 
env:
  IMAGE_TAG: sha-${{ github.sha }}
 
jobs:
  security-scan:
    uses: ./.github/workflows/sast-sca.yml

  build:
    needs: [security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Вход в ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | \
            docker login --username AWS --password-stdin \
            ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Build & push backend
        env:
          IMAGE_SHA: ${{ vars.AWS_ECR_BACKEND_REPO }}:${{ env.IMAGE_TAG }}
          IMAGE_LATEST: ${{ vars.AWS_ECR_BACKEND_REPO }}:latest
        run: |
          docker build -t $IMAGE_SHA -t $IMAGE_LATEST ./back
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST

      - name: Build & push frontend
        env:
          IMAGE_SHA: ${{ vars.AWS_ECR_FRONTEND_REPO }}:${{ env.IMAGE_TAG }}
          IMAGE_LATEST: ${{ vars.AWS_ECR_FRONTEND_REPO }}:latest
        run: |
          docker build --build-arg VITE_API_URL=${{ vars.AWS_VITE_API_URL }} -t $IMAGE_SHA -t $IMAGE_LATEST ./front
          docker push $IMAGE_SHA
          docker push $IMAGE_LATEST
 
  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Build Helm dependencies
        run: helm dependency build ./helm/myapp

      - name: Deploy with Helm
        run: |
          helm upgrade myapp ./helm/myapp \
            --reuse-values \
            --set frontend.image.tag="$IMAGE_TAG" \
            --set backend.image.tag="$IMAGE_TAG" \
            --wait \
            --timeout 4m

  notify:
    needs: [security-scan, build, deploy]
    if: always()
    uses: ./.github/workflows/notify.yaml
    with:
      results: |
        {
          "checks": "${{ needs.security-scan.result }}",
          "build":  "${{ needs.build.result }}",
          "deploy": "${{ needs.deploy.result }}"
        }
      version: "sha-${{ github.sha }}"
    secrets:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
