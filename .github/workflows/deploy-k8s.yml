name: Deploy k8s

on:
  push:
    branches: [week*]

jobs:
  checks:
    uses: ./.github/workflows/typecheck.yaml

  build:
    needs: [checks]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.bp.outputs.image }}
      version: ${{ steps.bp.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and push backend
        id: bp
        run: |
          IMAGE=${{ vars.DOCKER_USER }}/todo-back:sha-${{ github.sha }}
          docker build --platform linux/amd64 -t $IMAGE -t ${{ vars.DOCKER_USER }}/todo-back:latest back
          docker push $IMAGE
          docker push ${{ vars.DOCKER_USER }}/todo-back:latest
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "version=sha-${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: Deploy to k3s
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          envsubst < k8s/backend.yaml | kubectl apply -f -
          kubectl rollout status deployment/backend --timeout=120s

  notify:
    needs: [checks, build, deploy]
    if: always()
    uses: ./.github/workflows/notify.yaml
    with:
      results: |
        {
          "checks": "${{ needs.checks.result }}",
          "build":  "${{ needs.build.result }}",
          "deploy": "${{ needs.deploy.result }}"
        }
      version: "sha-${{ github.sha }}"
    secrets:
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
